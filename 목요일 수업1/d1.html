<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>스타일시트 연습</title>
	<style type="text/css">
		.main{
			background-color: #ffe4e1;
		}
		.h{
			color: #800080
		}
		#h:hover{
			color: red;
		}
		.a{
			border:  5px solid #9acd32;
		}
		.s{
			font-size: 20px;
		}
		span{
			color: #0000ff;
		}
		#p:hover{
			font-size: 20px;
		}
	</style>
</head>
<body class="main">
	<h3 class="h" id="h">CSS <span>스타일</span>맛보기</h3>
 	<hr class="a">
 	<p id="p">나는<span class="s">웹프로그래밍</span>을좋아합니다.</p>
</body>
</html>
