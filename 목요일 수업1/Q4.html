<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

<body>
	<script>
		let arr=["red","pink","blue","purple"];  // 4가지 색을 담은 배열 정의하기
		let today=new Date();
 		let color=today.getSeconds()  % 4;
 		document.bgColor= arr[color];

	</script>
