<!DOCTYPE html>
 <html>
 <head>
 	<title>같은 문서내에서 링크걸기</title>
 	<style type="text/css">
 		h2{
 			color: #ff0000;
 		}

 		span{
 			color: black;
 			font-family: "궁서";
 		}

 		img{
 			widows: 200px;
 			height: 120px;
 		}

 		a{
 			color: #000000;
 			text-decoration: none;
 		}
 	</style>
 </head>
 <body>
	<h2 id="a">복 습</h2>
 	<ul>
 		<li>HTML이란</li>   
 		<li>태그란</li>
 		<li>HTML문서의저작도구</li>
 	</ul>
	<br><br><br><br><br><br><br><br><br><br><br><br><br>
 	HTML 이란 <span>Hyper Text Markup Language</span>의 약자로 웹문서를 작성하기 위한 표준적인 언어이다. <br>
 	<a href="#a">[위로]</a>
 	<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
	태그란 <b>웹문서</b>를 만들기위한 기본골격을 이루는 것으로 일종의<u>명령어</u>라할수있다. 태그는<i><b>브라우저상</b></i>에 나타나지않
	는다.<br> 
	<a href="#a">[위로]</a>
 	<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>
 	HTML문서의 저작도구에는 메모장과 같은 단순한 기본에 디터에서부터 웹 전문에 디터프로그램까지 다양하다.  
	<br><br>
 	<a href="#a">[위로]
 	<img src="./apple.png" alt="사과 그림" title="클릭하면 메뉴로">
 	</a>
 </body>
 </html>
