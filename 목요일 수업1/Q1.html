<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script>
		function gugudan(a){
			for (let i=2; i<=9; i++)  {
				document.write(i + '*' + a + '=' + (i * a));
				document.write('<br>');
				}
		}

		function adder(a,b){
			let sum= a + b;
				document.write(a + '+' + b + '=' + sum);
				document.write('<br>');
			}
	</script>
</head>
<body>
	<script>
		let dan = prompt('단수를 입력하세요');
		if (isNaN(dan)==true)
			alert('숫자를 입력해야합니다!!!');
		else
			gugudan(dan);

		let a=prompt("더하기 할 숫자를 입력하세요");
		let b=prompt("더하기 할 숫자를 입력하세요");
		if (isNaN(a) || isNaN(b)) 
			alert('숫자를 입력해야합니다!!!');
		else{
			a=parseInt(a);
			b=parseInt(b);
			adder(a,b);
		}
		
	</script>
</body>
</html>
