<h4> 멀티미디어란</h4>
<p>
멀티미디어(MultiMedia)라는 단어는 Muiltiple(다수)과 Media(매체)의 합성어이다.
미디어란 인간 상호간의 지식과 감정이나 의사를 전달하는 수단으로 숫자, 문자, 소리, 음악, 그래픽, 애니메이션, 비디오 등이 포함된다.<br><br>

질문이 있는 사람은 <a href="mailto:ohsuk@mjc.ac.kr">나에게 메일</a>을 보내시기 바랍니다.
</p>
