<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
	<script>
		let num=new Array(5);   let sum=0;
 		for (let i=0;i<5;i++)  {
 			let user=prompt('숫자를 입력해주세요') ;  
 			user=parseInt(user);
			num[i]=user;  
		}
 		for (let i=0;i<5;i++)  {
 			sum += num[i];
		}
 		document.write("합계 : " + sum);
	</script>
</body>
</html>
