<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>나의 실습</title>
	<style>
		li{
			list-style: none;
			float: left;
			padding: 15px;
		}
		ul { overflow: hidden; }
		li:first-child { border-radius: 10px 0 0 10px; }
		li:last-child { border-radius: 0 10px 10px 0; }
 		li:nth-child(even) { background-color: #FF0003; }
 		li:nth-child(odd) { background-color:#800000; }
 </style>
 
	</style>
</head>
<body>
	<ul>
 		<li>1번째</li>
 		<li>2번째</li>
 		<li>3번째</li>
 		<li>4번째</li>
 		<li>5번째</li>
 		<li>6번째</li>
 		<li>7번째</li>
 	</ul>
</body>
</html>
