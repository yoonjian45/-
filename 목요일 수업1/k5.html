<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style>
		li{
			margin: 10px;
		}
		ul > li{
			display: inline;
		}
		ol > li{
			display: inline-block;
		}
		ol > li:nth-child(2){
			display: none;
		}
	</style>
</head>
<body>
	<ul>
		<li>1번째</li>
	 	<li>2번째</li>
	 	<li>3번째</li>
	</ul>
	 <ol>
 		<li>4번째</li>
 		<li>5번째</li>
 		<li>6번째</li>
 	</ol>

</body>
</html>
